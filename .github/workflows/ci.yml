
name: TP3 - Continuous Integration

on:
  push:
    branches:
      - main
      - feature/soustraction-with-unit-tests
  pull_request:
    branches:
      - main

jobs:

  pylint:
    name: Code Quality - Pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pylint analysis
        run: pylint main.py test_main.py --fail-under=10

  run-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: pylint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --junitxml=report.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: report.xml

  calculate-coverage:
    name: Calculate Code Coverage
    runs-on: ubuntu-latest
    needs: pylint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculate coverage
        run: |
          pytest -v --cov=main --cov-fail-under=91 --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
